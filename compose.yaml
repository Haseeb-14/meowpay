services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meowpay
      POSTGRES_USER: meowpay
      POSTGRES_PASSWORD: meowpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meowpay -d meowpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
