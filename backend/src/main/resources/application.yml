spring:
  application:
    name: meowpay-backend
  datasource:
    # Override with DB_URL when Postgres is not on localhost:5432
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meowpay}
    username: ${DB_USER:meowpay}
    password: ${DB_PASSWORD:meowpay}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the mapping against it
    open-in-view: false
  flyway:
    enabled: true
    # db/seed holds demo cats; application-prod.yml drops it
    locations: classpath:db/migration,classpath:db/seed

meowpay:
  # How long a transfer may wait for the account rows before failing with 503 try_again
  lock-timeout-ms: ${LOCK_TIMEOUT_MS:3000}
  # Browser origins allowed to call the API directly (the Next.js proxy needs none)
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8080}
